name: EAS Android Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: false
        default: production
        type: choice
        options:
          - production
          - preview
          - debug

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Android NDK
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci

      - name: Decode release keystore
        if: ${{ (inputs.profile || 'production') != 'debug' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android-release.keystore

      - name: Generate Android native project
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WORKER_URL: ${{ secrets.EXPO_PUBLIC_WORKER_URL }}
          EXPO_PUBLIC_REVENUECAT_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_KEY }}
        run: npx expo prebuild --platform android --no-install

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build Android
        shell: bash
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m'
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_WORKER_URL: ${{ secrets.EXPO_PUBLIC_WORKER_URL }}
          EXPO_PUBLIC_REVENUECAT_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_KEY }}
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          PROFILE="${{ inputs.profile || 'production' }}"
          mkdir -p dist logs
          KEYSTORE_PATH="$(pwd)/android-release.keystore"
          SIGN_FLAGS="-Pandroid.injected.signing.store.file=${KEYSTORE_PATH} -Pandroid.injected.signing.store.password=${ANDROID_KEYSTORE_PASSWORD} -Pandroid.injected.signing.key.alias=${ANDROID_KEY_ALIAS} -Pandroid.injected.signing.key.password=${ANDROID_KEY_PASSWORD}"

          if [ "$PROFILE" = "debug" ]; then
            (cd android && ./gradlew assembleDebug -PbundleInDebug=true --stacktrace --no-daemon -PreactNativeArchitectures=arm64-v8a) 2>&1 | tee logs/build.log
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/kachingo-android.apk
          elif [ "$PROFILE" = "preview" ]; then
            (cd android && ./gradlew assembleRelease $SIGN_FLAGS --stacktrace --no-daemon -PreactNativeArchitectures=arm64-v8a) 2>&1 | tee logs/build.log
            cp android/app/build/outputs/apk/release/app-release.apk dist/kachingo-android.apk
          else
            (cd android && ./gradlew bundleRelease $SIGN_FLAGS --stacktrace --no-daemon) 2>&1 | tee logs/build.log
            cp android/app/build/outputs/bundle/release/app-release.aab dist/kachingo-android.aab
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: mobile/logs/
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kachingo-android-${{ inputs.profile || 'production' }}-${{ github.sha }}
          path: mobile/dist/
          retention-days: 30
          if-no-files-found: error
